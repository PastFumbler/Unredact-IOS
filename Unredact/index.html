<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Unredact</title>
<meta name="description" content="A Wikipedia article, blacked out. Guess words to reveal it and find the title.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Unredact">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9EBEE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202329" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="brand">
      <div class="brand-name" aria-label="Unredact">Un<span class="brand-bar" aria-hidden="true"></span>act</div>
      <div class="brand-sub" id="puzzleLabel">Loading</div>
    </div>
    <button class="icon-btn" id="hintBtn" aria-label="Hint">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>
    </button>
  </header>

  <main id="scroller">
    <article id="sheet">
      <div class="title-wrap">
        <h1 id="title"></h1>
        <div id="stamp" class="stamp" aria-hidden="true">Declassified</div>
      </div>
      <div id="body"></div>
      <div id="loading" class="loading" hidden>
        <div class="skel" style="--w:62%"></div><div class="skel" style="--w:94%"></div><div class="skel" style="--w:88%"></div>
        <div class="skel" style="--w:97%"></div><div class="skel" style="--w:54%"></div>
        <p class="loading-text">Loading an article from Wikipedia…</p>
      </div>
      <div id="error" class="error" hidden>
        <p id="errorText">The article could not be loaded.</p>
        <button class="btn primary" id="retryBtn">Try again</button>
      </div>
      <div id="endNote" class="end-note" hidden></div>
    </article>
  </main>

  <div class="dock" id="dock">
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div class="chips-row">
      <button class="all-btn" id="allBtn">All <b id="guessCount">0</b></button>
      <div class="chips" id="chips"></div>
    </div>
    <div class="input-row">
      <input id="guessInput" type="text" lang="en" inputmode="text" enterkeyhint="go"
             autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
             placeholder="Guess a word" aria-label="Your guess">
      <button class="btn primary" id="guessBtn">Reveal</button>
    </div>
    <div class="status">
      <span>Guesses <b id="sGuesses">0</b></span>
      <span>Accuracy <b id="sAcc">—</b></span>
      <span><b id="sTime">0:00</b></span>
    </div>
    <div class="done-row" id="doneRow" hidden>
      <button class="btn" id="resultsBtn">Results</button>
      <button class="btn primary" id="nextBtn">Next article</button>
    </div>
  </div>
</div>

<div id="scrim" class="scrim" hidden></div>
<section id="sheetPanel" class="panel" hidden role="dialog" aria-modal="true">
  <div class="panel-handle" aria-hidden="true"></div>
  <div id="panelContent"></div>
</section>

<script src="js/stemmer.js"></script>
<script src="js/core.js"></script>
<script src="js/articles.js"></script>
<script src="js/facts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
